name: Wohnungs-Radar (alberlet.hu)

# Durchsucht alberlet.hu 2× täglich nach neuen Angeboten gemäß radar/config.json,
# committet den Stand und stößt danach den Pages-Deploy an, damit die Seite
# die frischen Treffer zeigt.
#
# Optional (Push aufs Handy): Secrets TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID
# anlegen – dann meldet der Radar echte Neuzugänge zusätzlich per Telegram.

on:
  schedule:
    - cron: "30 4 * * *"   # 06:30 Budapest (Sommerzeit)
    - cron: "30 14 * * *"  # 16:30 Budapest (Sommerzeit)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Parser-Selbsttest
        run: node radar/scrape.mjs --selftest

      - name: Scrape alberlet.hu
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node radar/scrape.mjs

      - name: Stand committen (falls geändert)
        id: commit
        run: |
          git config user.name "wohnungs-radar[bot]"
          git config user.email "radar@users.noreply.github.com"
          git add radar/seen.json radar/latest.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Keine Änderungen."
          else
            NEW=$(node -e "try{console.log(require('./radar/latest.json').newCount||0)}catch(e){console.log(0)}")
            git commit -m "radar: Lauf $(date -u +%F' '%R) UTC – $NEW neue Angebote"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy anstoßen
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY"
